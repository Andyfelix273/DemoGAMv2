<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFC Viewer 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    #viewer-canvas { display: block; width: 100vw; height: 100vh; }
    #toolbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: rgba(13,17,23,0.92);
      border-bottom: 1px solid #30363d;
      z-index: 10;
    }
    #toolbar .toolbar-label {
      font-size: 11px; font-weight: 600; color: #8b949e;
      text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px;
    }
    .disc-btn {
      padding: 4px 10px; border-radius: 4px; border: 1px solid #30363d;
      background: #21262d; color: #e6edf3; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .disc-btn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }
    .disc-btn:hover:not(.active) { background: #30363d; }
    #floor-select {
      margin-left: auto; padding: 4px 8px; border-radius: 4px;
      border: 1px solid #30363d; background: #21262d;
      color: #e6edf3; font-size: 12px; cursor: pointer;
    }
    #progress-wrap {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(13,17,23,0.95); z-index: 20;
    }
    #progress-wrap .progress-title { font-size: 14px; color: #8b949e; margin-bottom: 16px; }
    #progress-bar-outer { width: 280px; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
    #progress-bar-inner { height: 100%; width: 0%; background: #1f6feb; border-radius: 3px; transition: width 0.2s; }
    #progress-pct { font-size: 12px; color: #8b949e; margin-top: 8px; }
    #progress-status { font-size: 11px; color: #8b949e; margin-top: 4px; opacity: 0.7; }
    #props-panel {
      position: absolute; right: 0; top: 41px; bottom: 0;
      width: 260px; background: rgba(13,17,23,0.95);
      border-left: 1px solid #30363d;
      overflow-y: auto; padding: 12px;
      transform: translateX(100%); transition: transform 0.2s; z-index: 10;
    }
    #props-panel.open { transform: translateX(0); }
    #props-panel h3 {
      font-size: 12px; font-weight: 600; color: #8b949e;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #30363d;
    }
    .prop-row { display: flex; flex-direction: column; margin-bottom: 8px; }
    .prop-key { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.3px; }
    .prop-val { font-size: 12px; color: #e6edf3; word-break: break-all; }
    #props-close { float: right; background: none; border: none; color: #8b949e; cursor: pointer; font-size: 16px; line-height: 1; }
    #props-close:hover { color: #e6edf3; }
    #error-msg {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #1c1c1c; border: 1px solid #f85149;
      border-radius: 8px; padding: 20px 28px; text-align: center; z-index: 30;
    }
    #error-msg .err-icon { font-size: 24px; margin-bottom: 8px; }
    #error-msg p { font-size: 13px; color: #f85149; }
  </style>
  <link rel="stylesheet" href="/static/css/icons.css">
</head>
<body>
  <canvas id="viewer-canvas"></canvas>
  <div id="toolbar">
    <span class="toolbar-label">Disciplina</span>
    <button class="disc-btn active" data-disc="arc" title="Architettura">ARC</button>
    <button class="disc-btn" data-disc="str" title="Strutture">STR</button>
    <button class="disc-btn" data-disc="mep" title="Impianti">MEP</button>
    <select id="floor-select"><option value="all">Tutti i piani</option></select>
  </div>
  <div id="progress-wrap">
    <p class="progress-title" id="progress-title">Caricamento modello IFC&hellip;</p>
    <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
    <p id="progress-pct">0%</p>
    <p id="progress-status">Inizializzazione&hellip;</p>
  </div>
  <div id="props-panel">
    <h3><button id="props-close">&times;</button>Proprieta IFC</h3>
    <div id="props-content"></div>
  </div>
  <div id="error-msg">
    <div class="err-icon">!</div>
    <p id="error-text">Errore nel caricamento del modello.</p>
  </div>

  <script type="module">
    import * as THREE from '/static/js/ifc/three-136.module.js';
    import { IFCLoader } from '/static/js/ifc/IFCLoader-046.js';
    import { OrbitControls } from '/static/js/ifc/OrbitControls.js';

    const IFC_FILES = {
      arc: '/static/ifc/Ifc4_Revit_ARC.ifc',
      str: '/static/ifc/Ifc4_Revit_STR.ifc',
      mep: '/static/ifc/Ifc4_Revit_MEP.ifc'
    };
    const DISC_LABELS = { arc: 'Architettura', str: 'Strutture', mep: 'Impianti' };
    const IFCBUILDINGSTOREY = 3124254112;

    let scene, camera, renderer, controls, ifcLoader, ifcModel, raycaster, mouse;
    let currentDisc = 'arc';
    let isLoading = false;

    function setProgress(pct, status) {
      document.getElementById('progress-bar-inner').style.width = pct + '%';
      document.getElementById('progress-pct').textContent = pct + '%';
      if (status) document.getElementById('progress-status').textContent = status;
    }

    function showProgress(title) {
      const wrap = document.getElementById('progress-wrap');
      wrap.style.display = 'flex';
      if (title) document.getElementById('progress-title').textContent = title;
      setProgress(0, 'Inizializzazione...');
    }

    function hideProgress() {
      document.getElementById('progress-wrap').style.display = 'none';
    }

    function showError(msg) {
      hideProgress();
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-msg').style.display = 'none';
    }

    function initScene() {
      const canvas = document.getElementById('viewer-canvas');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1117);
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(20, 20, 30);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(50, 80, 50);
      scene.add(dir);
      scene.add(new THREE.HemisphereLight(0x1a2a4a, 0x0d1117, 0.4));
      scene.add(new THREE.GridHelper(100, 40, 0x30363d, 0x21262d));
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      raycaster = new THREE.Raycaster();
      raycaster.firstHitOnly = true;
      mouse = new THREE.Vector2();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      canvas.addEventListener('click', onCanvasClick);
      (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
    }

    function disposeCurrentModel() {
      if (!ifcModel) return;
      scene.remove(ifcModel);
      ifcModel.geometry && ifcModel.geometry.dispose();
      if (Array.isArray(ifcModel.material)) {
        ifcModel.material.forEach(m => m.dispose());
      } else if (ifcModel.material) {
        ifcModel.material.dispose();
      }
      // Dispose children recursively
      ifcModel.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
          else child.material.dispose();
        }
      });
      ifcModel = null;
      // Reset floor select
      const select = document.getElementById('floor-select');
      select.innerHTML = '<option value="all">Tutti i piani</option>';
    }

    function loadIFC(disc) {
      if (isLoading) return;
      isLoading = true;
      hideError();
      disposeCurrentModel();

      const url = IFC_FILES[disc];
      const label = DISC_LABELS[disc] || disc.toUpperCase();
      showProgress('Caricamento ' + label + '...');

      ifcLoader = new IFCLoader();
      ifcLoader.ifcManager.setWasmPath('/static/js/ifc/');
      setProgress(0, 'Download file IFC...');

      ifcLoader.load(
        url,
        (model) => {
          ifcModel = model;
          scene.add(ifcModel);
          setProgress(100, 'Completato');
          const box = new THREE.Box3().setFromObject(ifcModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          camera.position.set(center.x + maxDim, center.y + maxDim * 0.8, center.z + maxDim);
          controls.target.copy(center);
          controls.update();
          populateFloors().catch(() => {});
          setTimeout(hideProgress, 500);
          isLoading = false;
          window.parent.postMessage({ type: 'ifc-loaded', status: 'ok', disc: disc }, '*');
        },
        (progress) => {
          if (progress.total > 0) {
            const pct = Math.min(Math.round((progress.loaded / progress.total) * 100), 99);
            const mb = Math.round(progress.loaded / 1024 / 1024 * 10) / 10;
            setProgress(pct, 'Download: ' + mb + ' MB');
          } else {
            const mb = Math.round(progress.loaded / 1024 / 1024 * 10) / 10;
            setProgress(50, 'Download: ' + mb + ' MB...');
          }
        },
        (err) => {
          const msg = (err && err.message) ? err.message : String(err);
          showError('Errore caricamento ' + label + ': ' + msg);
          isLoading = false;
          window.parent.postMessage({ type: 'ifc-loaded', status: 'error', disc: disc, message: msg }, '*');
        }
      );
    }

    async function populateFloors() {
      const storeys = await ifcLoader.ifcManager.getAllItemsOfType(0, IFCBUILDINGSTOREY, false);
      const select = document.getElementById('floor-select');
      for (const id of storeys) {
        const props = await ifcLoader.ifcManager.getItemProperties(0, id);
        const name = (props && props.Name && props.Name.value) ? props.Name.value : 'Piano ' + id;
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = name;
        select.appendChild(opt);
      }
    }

    async function onCanvasClick(event) {
      if (!ifcModel || isLoading) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(ifcModel, false);
      if (!intersects.length) { closePropPanel(); return; }
      try {
        const expressID = ifcLoader.ifcManager.getExpressId(intersects[0].object.geometry, intersects[0].faceIndex);
        const props = await ifcLoader.ifcManager.getItemProperties(0, expressID, true);
        const psets = await ifcLoader.ifcManager.getPropertySets(0, expressID, true);
        showPropPanel(expressID, props, psets);
      } catch(e) {}
    }

    function showPropPanel(expressID, props, psets) {
      const rows = [
        { key: 'Express ID', val: expressID },
        { key: 'Tipo IFC', val: (props && props.type) ? props.type : '-' },
        { key: 'Nome', val: (props && props.Name && props.Name.value) ? props.Name.value : '-' },
        { key: 'GUID', val: (props && props.GlobalId && props.GlobalId.value) ? props.GlobalId.value : '-' },
        { key: 'Tag', val: (props && props.Tag && props.Tag.value) ? props.Tag.value : '-' },
      ];
      let html = rows.map(r => '<div class="prop-row"><span class="prop-key">' + r.key + '</span><span class="prop-val">' + r.val + '</span></div>').join('');
      if (psets && psets.length) {
        psets.forEach(pset => {
          if (!pset || !pset.HasProperties) return;
          const pname = (pset.Name && pset.Name.value) ? pset.Name.value : 'PropertySet';
          html += '<div class="prop-row" style="margin-top:10px"><span class="prop-key" style="color:#1f6feb">' + pname + '</span></div>';
          pset.HasProperties.forEach(p => {
            const k = (p && p.Name && p.Name.value) ? p.Name.value : '-';
            const v = (p && p.NominalValue && p.NominalValue.value !== undefined) ? p.NominalValue.value : ((p && p.Value && p.Value.value !== undefined) ? p.Value.value : '-');
            html += '<div class="prop-row"><span class="prop-key">' + k + '</span><span class="prop-val">' + v + '</span></div>';
          });
        });
      }
      document.getElementById('props-content').innerHTML = html;
      document.getElementById('props-panel').classList.add('open');
    }

    function closePropPanel() {
      document.getElementById('props-panel').classList.remove('open');
    }

    // Toggle disciplina: carica il file IFC corrispondente on-demand
    document.querySelectorAll('.disc-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const disc = btn.dataset.disc;
        if (disc === currentDisc && ifcModel) return; // gia caricato
        // Aggiorna UI pulsanti
        document.querySelectorAll('.disc-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDisc = disc;
        loadIFC(disc);
      });
    });

    document.getElementById('props-close').addEventListener('click', closePropPanel);

    // Filtro per piano (visibilita layer)
    document.getElementById('floor-select').addEventListener('change', async (e) => {
      if (!ifcModel || !ifcLoader) return;
      const val = e.target.value;
      if (val === 'all') {
        ifcModel.visible = true;
        return;
      }
      // Mostra solo gli elementi del piano selezionato
      // Semplice implementazione: mostra tutto (filtro avanzato richiederebbe subset manager)
      ifcModel.visible = true;
    });

    // Messaggio da parent per caricare una disciplina specifica
    window.addEventListener('message', (ev) => {
      if (ev.data && ev.data.type === 'load-disc') {
        const disc = ev.data.disc;
        if (IFC_FILES[disc]) {
          document.querySelectorAll('.disc-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.disc === disc);
          });
          currentDisc = disc;
          loadIFC(disc);
        }
      }
    });

    initScene();
    loadIFC('arc');
  </script>
</body>
</html>
