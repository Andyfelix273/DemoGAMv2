<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Asset Efficiency – Tariffe &amp; Bollette</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/v4-shims.min.css">
  <link rel="stylesheet" href="/static/css/icons.css">
  <link rel="stylesheet" href="/static/css/bems-ui.css">
</head>
<body class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="sidebar-content">
  <header class="topbar" id="topbar"></header>
  <div class="page">

    <!-- HEADER PAGINA -->
    <div class="page-header">
      <h1 class="page-title">
        <i class="fa fa-file-invoice-dollar" style="margin-right:8px;color:var(--accent-blue)"></i>Tariffe &amp; Bollette
      </h1>
      <div class="page-actions">
        <select id="filter-commodity" class="btn btn-secondary btn-sm">
          <option value="">Tutte le commodity</option>
          <!-- Popolato dinamicamente da JS -->
        </select>
        <select id="filter-tipo" class="btn btn-secondary btn-sm">
          <option value="">Tutti i tipi</option>
          <option value="stabilimento">Stabilimento</option>
          <option value="ufficio">Ufficio</option>
          <option value="magazzino">Magazzino</option>
          <option value="deposito">Deposito</option>
        </select>
        <input type="text" id="search-input" placeholder="Cerca asset…" class="filtri-input">
      </div>
    </div>

    <!-- KPI STRIP (generata dinamicamente) -->
    <div class="kpi-strip" id="kpi-strip">
      <div class="kpi-card">
        <div class="kpi-icon"><i class="fa fa-file-invoice"></i></div>
        <div class="kpi-body">
          <div class="kpi-val" id="kpi-tot-bollette">–</div>
          <div class="kpi-lbl">Bollette totali caricate</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="color:var(--accent-orange)"><i class="fa fa-exclamation-triangle"></i></div>
        <div class="kpi-body">
          <div class="kpi-val" id="kpi-disambig">–</div>
          <div class="kpi-lbl">Da abbinare</div>
        </div>
      </div>
      <!-- Card commodity inserite dinamicamente in #kpi-commodity-cards -->
      <template id="kpi-commodity-tpl">
        <div class="kpi-card kpi-commodity-card" data-commodity="">
          <div class="kpi-icon"></div>
          <div class="kpi-body">
            <div class="kpi-val">–</div>
            <div class="kpi-lbl"></div>
          </div>
        </div>
      </template>
    </div>

    <!-- TABELLA ASSET CON COSTI UNITARI -->
    <div class="page-body">
      <div class="table-wrap">
        <table id="inv-table">
          <thead id="inv-thead">
            <tr>
              <th>Codice</th>
              <th>Asset</th>
              <th>Tipo</th>
              <th>Città</th>
              <!-- Colonne commodity inserite dinamicamente -->
              <th>Bollette</th>
              <th>Ultima bolletta</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="inv-tbody">
            <tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-secondary)">
              <span class="spinner"></span> Caricamento…
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- .page -->
  </div><!-- .sidebar-content -->

  <script src="/static/js/api.js?v=2"></script>
  <script src="/static/js/utils.js?v=2"></script>
  <script>
    // ── Costanti commodity (unica fonte di verità, allineata al backend) ────────
    const COMMODITY_META = {
      ELECTRICITY:  { label: 'Elettricità',          unit: 'kWh',   icon: 'fa-bolt',             color: 'var(--accent-blue,#00A3E0)' },
      GAS_METHANE:  { label: 'Gas Metano',            unit: 'Smc',   icon: 'fa-fire',             color: 'var(--accent-orange,#F39C12)' },
      GAS_GPL:      { label: 'GPL',                   unit: 'kg',    icon: 'fa-fire-flame-curved', color: '#E67E22' },
      WATER:        { label: 'Acqua',                 unit: 'm³',    icon: 'fa-droplet',          color: '#3498DB' },
      HEATING_OIL:  { label: 'Gasolio riscaldamento', unit: 'litri', icon: 'fa-oil-can',          color: '#8E44AD' },
      DIESEL:       { label: 'Gasolio autotrazione',  unit: 'litri', icon: 'fa-gas-pump',         color: '#7F8C8D' },
      PETROL:       { label: 'Benzina',               unit: 'litri', icon: 'fa-gas-pump',         color: '#27AE60' },
    };

    // Commodity effettivamente presenti nei dati (calcolato al caricamento)
    let activeCommodities = [];
    let allRows = [];

    // ── Utility ───────────────────────────────────────────────────────────────
    function fmtEur(v) {
      if (v == null) return '<span style="color:var(--text-muted)">–</span>';
      return '€ ' + parseFloat(v).toFixed(4).replace('.', ',');
    }
    function fmtData(s) {
      if (!s) return '–';
      return new Date(s).toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric' });
    }

    // ── Costruzione UI dinamica ───────────────────────────────────────────────
    function buildDynamicUI(commodities) {
      activeCommodities = commodities;

      // Filtro commodity
      const sel = document.getElementById('filter-commodity');
      sel.innerHTML = '<option value="">Tutte le commodity</option>';
      commodities.forEach(c => {
        const m = COMMODITY_META[c] || { label: c };
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = m.label;
        sel.appendChild(opt);
      });

      // KPI card commodity (inserite dopo le card fisse)
      const strip = document.getElementById('kpi-strip');
      strip.querySelectorAll('.kpi-commodity-card').forEach(el => el.remove());
      commodities.forEach(c => {
        const m = COMMODITY_META[c] || { label: c, unit: '', icon: 'fa-circle', color: '#888' };
        const card = document.createElement('div');
        card.className = 'kpi-card kpi-commodity-card';
        card.dataset.commodity = c;
        card.innerHTML = `
          <div class="kpi-icon" style="color:${m.color}"><i class="fa ${m.icon}"></i></div>
          <div class="kpi-body">
            <div class="kpi-val" id="kpi-${c}-val">–</div>
            <div class="kpi-lbl">€/${m.unit} ${m.label} (media)</div>
          </div>`;
        strip.appendChild(card);
      });

      // Intestazioni tabella commodity
      const thead = document.getElementById('inv-thead').querySelector('tr');
      thead.querySelectorAll('th.th-commodity').forEach(el => el.remove());
      // Inserisci prima di "Bollette" (4° th fisso, indice 3 = dopo Città)
      const thBollette = thead.querySelectorAll('th')[4];
      commodities.forEach(c => {
        const m = COMMODITY_META[c] || { label: c, unit: '', icon: 'fa-circle', color: '#888' };
        const th = document.createElement('th');
        th.className = 'th-commodity';
        th.innerHTML = `<i class="fa ${m.icon}" style="color:${m.color}"></i> €/${m.unit}`;
        th.title = m.label;
        thead.insertBefore(th, thBollette);
      });
    }

    // ── Caricamento dati ──────────────────────────────────────────────────────
    async function caricaDashboard() {
      const AUTH = { headers: { 'Authorization': 'Bearer ' + API.getToken() } };

      // 1. Lista asset
      const rAssets = await fetch('/api/assets', AUTH);
      if (!rAssets.ok) { renderErrore('Impossibile caricare gli asset'); return; }
      const geoJson = await rAssets.json();
      const assets  = geoJson.features
        ? geoJson.features.map(f => ({ id: f.properties.id, ...f.properties }))
        : (geoJson.assets || []);

      // 2. Costi unitari per asset (richiesta parallela)
      const costsPerAsset = {};
      await Promise.all(assets.map(async a => {
        try {
          const r = await fetch(`/api/bems/buildings/${a.id}/energy-costs`, AUTH);
          if (r.ok) costsPerAsset[a.id] = (await r.json()).energy_costs || [];
        } catch { costsPerAsset[a.id] = []; }
      }));

      // 3. Bollette per asset (richiesta parallela)
      const invPerAsset = {};
      await Promise.all(assets.map(async a => {
        try {
          const r = await fetch(`/api/bems/buildings/${a.id}/invoices`, AUTH);
          if (r.ok) invPerAsset[a.id] = (await r.json()).invoices || [];
        } catch { invPerAsset[a.id] = []; }
      }));

      // ── Calcola commodity attive (presenti in almeno un asset) ───────────────
      const commoditySet = new Set();
      Object.values(costsPerAsset).forEach(costs =>
        costs.forEach(c => commoditySet.add(c.commodity))
      );
      // Ordina secondo l'ordine canonico di COMMODITY_META
      const orderedCommodities = Object.keys(COMMODITY_META).filter(c => commoditySet.has(c));
      buildDynamicUI(orderedCommodities);

      // ── KPI aggregati per commodity ──────────────────────────────────────────
      const sumByCommodity = {};
      const cntByCommodity = {};
      Object.values(costsPerAsset).forEach(costs => {
        costs.forEach(c => {
          if (c.unit_cost_eur == null) return;
          sumByCommodity[c.commodity] = (sumByCommodity[c.commodity] || 0) + parseFloat(c.unit_cost_eur);
          cntByCommodity[c.commodity] = (cntByCommodity[c.commodity] || 0) + 1;
        });
      });
      orderedCommodities.forEach(c => {
        const el = document.getElementById(`kpi-${c}-val`);
        if (!el) return;
        const cnt = cntByCommodity[c] || 0;
        el.textContent = cnt > 0
          ? '€ ' + (sumByCommodity[c] / cnt).toFixed(4).replace('.', ',')
          : '–';
      });

      let totBollette = 0, totDisambig = 0;
      Object.values(invPerAsset).forEach(inv => {
        totBollette += inv.length;
        totDisambig += inv.filter(i =>
          i.extraction_status === 'needs_disambiguation' || i.extraction_status === 'wrong_asset'
        ).length;
      });
      document.getElementById('kpi-tot-bollette').textContent = totBollette;
      document.getElementById('kpi-disambig').textContent = totDisambig;
      if (totDisambig > 0) {
        document.getElementById('kpi-disambig').style.color = 'var(--accent-orange,#F39C12)';
      }

      // ── Costruzione righe tabella ────────────────────────────────────────────
      allRows = assets.map(a => {
        const costs = costsPerAsset[a.id] || [];
        const costsMap = {};
        costs.forEach(c => { costsMap[c.commodity] = c.unit_cost_eur; });

        const invoices    = invPerAsset[a.id] || [];
        const lastInvoice = invoices
          .filter(i => i.extraction_status === 'ready')
          .sort((a, b) => new Date(b.issue_date || 0) - new Date(a.issue_date || 0))[0];

        return {
          id:           a.id,
          codice:       a.codice || '',
          nome:         a.nome   || '',
          tipo:         a.tipo   || '',
          citta:        a.citta  || '',
          costsMap,
          nBollette:    invoices.length,
          nDisambig:    invoices.filter(i =>
            i.extraction_status === 'needs_disambiguation' || i.extraction_status === 'wrong_asset'
          ).length,
          lastDate:     lastInvoice?.issue_date ?? null,
          lastCommodity: lastInvoice?.commodity ?? null,
        };
      });

      applicaFiltri();
    }

    function applicaFiltri() {
      const q         = document.getElementById('search-input').value.toLowerCase();
      const commodity = document.getElementById('filter-commodity').value;
      const tipo      = document.getElementById('filter-tipo').value;

      const filtered = allRows.filter(r => {
        const matchQ = !q || r.codice.toLowerCase().includes(q) ||
                             r.nome.toLowerCase().includes(q) ||
                             r.citta.toLowerCase().includes(q);
        const matchT = !tipo || r.tipo === tipo;
        const matchC = !commodity || r.costsMap[commodity] != null;
        return matchQ && matchT && matchC;
      });

      renderTabella(filtered);
    }

    function renderTabella(rows) {
      const tbody = document.getElementById('inv-tbody');
      const colspan = 4 + activeCommodities.length + 3;
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center;padding:30px;color:var(--text-secondary)">Nessun asset trovato.</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(r => {
        const disambigBadge = r.nDisambig > 0
          ? `<span class="badge badge-manutenzione" style="margin-left:4px" title="${r.nDisambig} da abbinare">${r.nDisambig}</span>`
          : '';
        const lastStr = r.lastDate
          ? `${fmtData(r.lastDate)}${r.lastCommodity
              ? ' <span style="font-size:10px;color:var(--text-muted)">' +
                (COMMODITY_META[r.lastCommodity]?.label || r.lastCommodity) + '</span>'
              : ''}`
          : '<span style="color:var(--text-muted)">–</span>';

        const commodityCells = activeCommodities
          .map(c => `<td style="text-align:right;font-variant-numeric:tabular-nums">${fmtEur(r.costsMap[c] ?? null)}</td>`)
          .join('');

        return `<tr>
          <td><span class="asset-code">${r.codice}</span></td>
          <td><a href="#" onclick="apriDettaglioAsset(${r.id});return false" class="link-accent">${r.nome}</a></td>
          <td>${r.tipo}</td>
          <td>${r.citta}</td>
          ${commodityCells}
          <td style="text-align:center">${r.nBollette}${disambigBadge}</td>
          <td>${lastStr}</td>
          <td>
            <div class="actions-cell">
              <button class="btn-icon" title="Apri dettaglio asset" onclick="apriDettaglioAsset(${r.id})">
                <i class="fa fa-eye"></i>
              </button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    function renderErrore(msg) {
      document.getElementById('inv-tbody').innerHTML =
        `<tr><td colspan="8" style="text-align:center;padding:30px;color:#E74C3C">
          <i class="fa fa-exclamation-triangle" style="margin-right:6px"></i>${msg}
        </td></tr>`;
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    requireAuth();
    renderSidebar('eff-bollette', 'efficiency');
    renderTopbar('eff-bollette', { titolo: 'Asset Efficiency', modulo: 'efficiency' });

    document.getElementById('search-input').addEventListener('input', applicaFiltri);
    document.getElementById('filter-commodity').addEventListener('change', applicaFiltri);
    document.getElementById('filter-tipo').addEventListener('change', applicaFiltri);

    caricaDashboard().catch(err => {
      console.error('caricaDashboard error:', err);
      renderErrore('Errore caricamento dati: ' + (err.message || err));
    });
  </script>

  <!-- Modale dettaglio asset condivisa (per apertura da click riga) -->
  <script src="/static/js/efficiency-detail-modal.js?v=4"></script>
</body>
</html>
