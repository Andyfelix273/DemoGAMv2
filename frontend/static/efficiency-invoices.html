<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Asset Efficiency – Tariffe &amp; Bollette</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/v4-shims.min.css">
  <link rel="stylesheet" href="/static/css/icons.css">
  <link rel="stylesheet" href="/static/css/bems-ui.css">
  <link rel="stylesheet" href="/static/css/map.css">
</head>
<body class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="sidebar-content">
  <header class="topbar" id="topbar"></header>
  <div class="page">

    <!-- HEADER PAGINA -->
    <div class="page-header">
      <h1 class="page-title">
        <i class="fa fa-file-invoice-dollar"></i>Tariffe &amp; Bollette
      </h1>
    </div>

    <!-- KPI STRIP -->
    <div class="page-body" style="padding-bottom:0">
      <div class="kpi-strip" id="kpi-strip">
        <div class="kpi-card info">
          <div class="kpi-val" id="kpi-tot">–</div>
          <div class="kpi-lbl">Bollette totali</div>
        </div>
        <div class="kpi-card" id="kpi-disambig-card">
          <div class="kpi-val" id="kpi-disambig">–</div>
          <div class="kpi-lbl">Da abbinare</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-val" id="kpi-assets">–</div>
          <div class="kpi-lbl">Asset con bollette</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-val" id="kpi-importo">–</div>
          <div class="kpi-lbl">Importo totale (€)</div>
        </div>
      </div>
    </div>

    <!-- BARRA FILTRI -->
    <div class="page-body" style="padding-top:8px;padding-bottom:8px">
      <div class="filter-bar">
        <div class="search-wrap">
          <i class="fa fa-search"></i>
          <input type="text" id="search-input" placeholder="Cerca asset, codice bolletta, fornitore…">
        </div>
        <select id="filter-periodo">
          <option value="">Tutto il periodo</option>
          <option value="1">Ultimo mese</option>
          <option value="2">Ultimo bimestre</option>
          <option value="3">Ultimi 3 mesi</option>
          <option value="6">Ultimi 6 mesi</option>
        </select>
        <select id="filter-commodity">
          <option value="">Tutte le forniture</option>
          <option value="ELECTRICITY">Elettricità</option>
          <option value="GAS_METHANE">Gas Metano</option>
          <option value="GAS_GPL">GPL</option>
          <option value="WATER">Acqua</option>
          <option value="HEATING_OIL">Gasolio riscaldamento</option>
          <option value="DIESEL">Gasolio autotrazione</option>
          <option value="PETROL">Benzina</option>
        </select>
        <select id="filter-categoria">
          <option value="">Tutte le categorie</option>
          <option value="stabilimento">Stabilimento</option>
          <option value="ufficio">Ufficio</option>
          <option value="magazzino">Magazzino</option>
          <option value="deposito">Deposito</option>
        </select>
        <select id="filter-stato">
          <option value="">Tutti gli stati</option>
          <option value="ready">Pronto</option>
          <option value="needs_disambiguation">Da abbinare</option>
          <option value="wrong_asset">Asset errato</option>
          <option value="error">Errore</option>
          <option value="processing">In elaborazione</option>
        </select>
        <span class="record-count" id="record-count"></span>
      </div>
    </div>

    <!-- TABELLA BOLLETTE -->
    <div class="page-body" style="padding-top:0">
      <div class="table-wrap">
        <table class="bems-table" id="inv-table">
          <thead>
            <tr>
              <th>Codice bolletta</th>
              <th>Fornitura</th>
              <th>Fornitore</th>
              <th>Importo</th>
              <th>Periodo da</th>
              <th>Periodo a</th>
              <th>Data fattura</th>
              <th>Asset</th>
              <th>Categoria</th>
              <th>Città</th>
              <th>Stato</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="inv-tbody">
            <tr><td colspan="12" style="text-align:center;padding:30px;color:var(--text-secondary)">
              <span class="spinner"></span> Caricamento…
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- .page -->
  </div><!-- .sidebar-content -->

  <script src="/static/js/i18n.js?v=8"></script>
  <script src="/static/js/api.js?v=8"></script>
  <script src="/static/js/utils.js?v=8"></script>
  <script>
    // ── Commodity meta (unica fonte di verità) ────────────────────────────────
    const COMMODITY_META = {
      ELECTRICITY:  { label: 'Elettricità',          unit: 'kWh',   icon: 'fa-bolt',              color: 'var(--accent-blue,#00A3E0)' },
      GAS_METHANE:  { label: 'Gas Metano',            unit: 'Smc',   icon: 'fa-fire',              color: 'var(--accent-orange,#F39C12)' },
      GAS_GPL:      { label: 'GPL',                   unit: 'kg',    icon: 'fa-fire-flame-curved',  color: '#E67E22' },
      WATER:        { label: 'Acqua',                 unit: 'm³',    icon: 'fa-droplet',           color: '#3498DB' },
      HEATING_OIL:  { label: 'Gasolio riscaldamento', unit: 'litri', icon: 'fa-oil-can',           color: '#8E44AD' },
      DIESEL:       { label: 'Gasolio autotrazione',  unit: 'litri', icon: 'fa-gas-pump',          color: '#7F8C8D' },
      PETROL:       { label: 'Benzina',               unit: 'litri', icon: 'fa-gas-pump',          color: '#27AE60' },
    };

    let allRows = [];

    // ── Utility ───────────────────────────────────────────────────────────────
    function fmtEur(v) {
      if (v == null) return '–';
      return '€ ' + parseFloat(v).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtData(s) {
      if (!s) return '–';
      return new Date(s).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    function statusBadge(status) {
      const map = {
        ready:                '<span class="badge badge-completato">Pronto</span>',
        processing:           '<span class="badge badge-in_corso">Elaborazione…</span>',
        needs_disambiguation: '<span class="badge badge-manutenzione">Da abbinare</span>',
        wrong_asset:          '<span class="badge badge-scaduta">Asset errato</span>',
        error:                '<span class="badge badge-scaduta">Errore</span>',
      };
      return map[status] || `<span class="badge">${status}</span>`;
    }
    function commodityBadge(commodity) {
      const m = COMMODITY_META[commodity];
      if (!m) return `<span class="tipo-badge">${commodity}</span>`;
      return `<span class="tipo-badge" style="color:${m.color}"><i class="fa ${m.icon}" style="margin-right:4px"></i>${m.label}</span>`;
    }

    // ── Caricamento dati ──────────────────────────────────────────────────────
    async function caricaDashboard() {
      const AUTH = { headers: { 'Authorization': 'Bearer ' + API.getToken() } };

      // 1. Lista asset (GeoJSON)
      const rAssets = await fetch('/api/assets', AUTH);
      if (!rAssets.ok) { renderErrore('Impossibile caricare gli asset (' + rAssets.status + ')'); return; }
      const geoJson = await rAssets.json();
      const assets = (geoJson.features || []).map(f => f.properties);
      const assetMap = {};
      assets.forEach(a => { assetMap[a.id] = a; });

      // 2. Bollette per ogni asset (richieste parallele)
      const invoicesByAsset = await Promise.all(
        assets.map(async a => {
          try {
            const r = await fetch(`/api/bems/buildings/${a.id}/invoices`, AUTH);
            if (!r.ok) return [];
            const d = await r.json();
            return (d.invoices || []).map(inv => ({ ...inv, _asset: a }));
          } catch { return []; }
        })
      );

      // 3. Appiattisci: una riga per bolletta, solo asset con almeno una bolletta
      allRows = invoicesByAsset.flat();

      // ── KPI ──────────────────────────────────────────────────────────────────
      const assetsConBollette = new Set(allRows.map(r => r.asset_id));
      const disambig = allRows.filter(r =>
        r.extraction_status === 'needs_disambiguation' || r.extraction_status === 'wrong_asset'
      ).length;
      const totImporto = allRows
        .filter(r => r.total_amount_eur != null)
        .reduce((s, r) => s + parseFloat(r.total_amount_eur), 0);

      document.getElementById('kpi-tot').textContent      = allRows.length;
      document.getElementById('kpi-disambig').textContent = disambig;
      document.getElementById('kpi-assets').textContent   = assetsConBollette.size;
      document.getElementById('kpi-importo').textContent  = totImporto > 0
        ? totImporto.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : '–';
      if (disambig > 0) {
        document.getElementById('kpi-disambig-card').classList.add('warning');
      }

      applicaFiltri();
    }

    // ── Filtri ────────────────────────────────────────────────────────────────
    function applicaFiltri() {
      const q         = (document.getElementById('search-input').value || '').toLowerCase();
      const periodo   = parseInt(document.getElementById('filter-periodo').value) || 0;
      const commodity = document.getElementById('filter-commodity').value;
      const categoria = document.getElementById('filter-categoria').value;
      const stato     = document.getElementById('filter-stato').value;

      // Calcola soglia data per il filtro periodo (basato su issue_date o period_to)
      let soglia = null;
      if (periodo > 0) {
        soglia = new Date();
        soglia.setMonth(soglia.getMonth() - periodo);
      }

      const filtered = allRows.filter(r => {
        const a = r._asset || {};
        const matchC = !commodity || r.commodity === commodity;
        const matchK = !categoria || (a.tipo || '') === categoria;
        const matchS = !stato    || r.extraction_status === stato;
        const matchQ = !q ||
          (r.invoice_number || '').toLowerCase().includes(q) ||
          (a.nome  || '').toLowerCase().includes(q) ||
          (a.citta || '').toLowerCase().includes(q) ||
          (r.supplier_name || '').toLowerCase().includes(q) ||
          (r.point_code    || '').toLowerCase().includes(q);
        let matchP = true;
        if (soglia) {
          // Usa period_to se disponibile, altrimenti issue_date, altrimenti created_at
          const dataRef = r.period_to || r.issue_date || r.created_at;
          matchP = dataRef ? new Date(dataRef) >= soglia : false;
        }
        return matchC && matchK && matchS && matchQ && matchP;
      });

      document.getElementById('record-count').textContent =
        filtered.length + ' / ' + allRows.length + ' bollette';

      renderTabella(filtered);
    }

    // ── Render tabella ────────────────────────────────────────────────────────
    function renderTabella(rows) {
      const tbody = document.getElementById('inv-tbody');
      if (rows.length === 0) {
        const msg = allRows.length === 0
          ? 'Nessuna bolletta caricata. Aprire un asset e caricare la prima bolletta dalla tab Tariffe &amp; Bollette.'
          : 'Nessun risultato per i filtri selezionati.';
        tbody.innerHTML = `<tr><td colspan="12" style="text-align:center;padding:30px;color:var(--text-secondary)">${msg}</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(r => {
        const a    = r._asset || {};
        const meta = COMMODITY_META[r.commodity] || {};
        const isWrong = r.extraction_status === 'wrong_asset' || r.extraction_status === 'needs_disambiguation';
        const rowCls  = isWrong ? ' style="border-left:3px solid var(--accent-orange)"' : '';
        const numBolletta = r.invoice_number
          ? `<code style="font-size:11px">${r.invoice_number}</code>`
          : `<span style="color:var(--text-muted);font-size:11px">${r.invoice_id.substring(0,8).toUpperCase()}</span>`;
        const dlBtn = r.file_path
          ? `<a class="btn-icon" href="/api/bems/buildings/${r.asset_id}/invoices/${r.invoice_id}/file" target="_blank" title="Scarica PDF"><i class="fa fa-download"></i></a>`
          : '';
        const detailBtn = `<button class="btn-icon" title="Apri dettaglio asset" onclick="apriDettaglioAsset(${r.asset_id})"><i class="fa fa-eye"></i></button>`;

        return `<tr${rowCls}>
          <td>${numBolletta}</td>
          <td>${commodityBadge(r.commodity)}</td>
          <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.supplier_name || ''}">${r.supplier_name || '–'}</td>
          <td style="text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${fmtEur(r.total_amount_eur)}</td>
          <td style="white-space:nowrap">${fmtData(r.period_from)}</td>
          <td style="white-space:nowrap">${fmtData(r.period_to)}</td>
          <td style="white-space:nowrap">${fmtData(r.issue_date)}</td>
          <td><a href="#" onclick="apriDettaglioAsset(${r.asset_id});return false" style="color:var(--accent-blue);text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${a.nome || '–'}</a></td>
          <td><span class="tipo-badge">${a.tipo || '–'}</span></td>
          <td>${a.citta || '–'}</td>
          <td>${statusBadge(r.extraction_status)}</td>
          <td><div class="row-actions">${dlBtn}${detailBtn}</div></td>
        </tr>`;
      }).join('');
    }

    function renderErrore(msg) {
      document.getElementById('inv-tbody').innerHTML =
        `<tr><td colspan="12" style="text-align:center;padding:30px;color:var(--accent-red)">
          <i class="fa fa-exclamation-triangle" style="margin-right:6px"></i>${msg}
        </td></tr>`;
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    requireAuth();
    renderSidebar('eff-bollette', 'efficiency');
    renderTopbar('eff-bollette', { titolo: 'Asset Efficiency', modulo: 'efficiency' });
    i18n.apply();

    document.getElementById('search-input').addEventListener('input', applicaFiltri);
    document.getElementById('filter-periodo').addEventListener('change', applicaFiltri);
    document.getElementById('filter-commodity').addEventListener('change', applicaFiltri);
    document.getElementById('filter-categoria').addEventListener('change', applicaFiltri);
    document.getElementById('filter-stato').addEventListener('change', applicaFiltri);

    caricaDashboard().catch(err => {
      console.error('caricaDashboard error:', err);
      renderErrore('Errore caricamento dati: ' + (err.message || err));
    });
  </script>

  <!-- Modale dettaglio asset condivisa (per apertura da click riga) -->
  <script src="/static/js/efficiency-detail-modal.js?v=2"></script>
</body>
</html>
