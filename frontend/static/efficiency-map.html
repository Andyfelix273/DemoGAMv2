<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Efficiency – Mappa</title>
  <!-- Preconnect per ridurre latenza CDN -->
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://tile.jawg.io">
  <!-- CSS critici -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Font locale (evita Google Fonts) -->
  <style>body,button,input{font-family:'Segoe UI',system-ui,sans-serif;}</style>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/map.css">
  <link rel="stylesheet" href="/static/css/bems-ui.css?v=3">
  <link rel="stylesheet" href="/static/css/icons.css">
</head>
<body>
<!-- SIDEBAR -->
<nav id="map-sidebar"></nav>

<!-- TOPBAR -->
<div class="topbar" id="topbar-root">
  <!-- Logo + titolo -->
  <img id="meta-logo" src="/static/img/logodark.png" alt="Metamorphosis" class="topbar-logo">
  <div class="topbar-sep"></div>
  <span class="topbar-title">Asset Efficiency</span>
  <!-- Ricerca asset -->
  <div class="search-wrap">
    <i class="fas fa-search search-icon-fa"></i>
    <input type="text" id="search-input" class="search-input" placeholder="Cerca asset...">
    <div class="search-results" id="search-results"></div>
  </div>
  <!-- Filtri tipo asset -->
  <div class="topbar-filters">
    <button class="filter-btn active" data-tipo="tutti">
      <i class="fas fa-layer-group" style="font-size:10px;"></i> Tutti
    </button>
    <button class="filter-btn" data-tipo="stabilimento">
      <i class="fas fa-industry" style="font-size:10px;"></i> Stabilimenti
    </button>
    <button class="filter-btn" data-tipo="ufficio">
      <i class="fas fa-building" style="font-size:10px;"></i> Uffici
    </button>
    <button class="filter-btn" data-tipo="magazzino">
      <i class="fas fa-archive" style="font-size:10px;"></i> Magazzini
    </button>
    <button class="filter-btn" data-tipo="deposito">
      <i class="fas fa-truck" style="font-size:10px;"></i> Depositi
    </button>
  </div>
  <!-- Controlli destra -->
  <div class="topbar-controls">
    <!-- Campanella allarmi energetici -->
    <div id="topbar-alarm-wrap" style="position:relative;margin-right:8px;cursor:pointer" onclick="window.location.href='/static/efficiency-alarms.html'" title="Vai agli allarmi energetici">
      <i class="fa fa-bell" style="font-size:16px;color:var(--text-secondary)"></i>
      <span id="topbar-alarm-badge" style="
        display:none;
        position:absolute;top:-6px;right:-8px;
        background:#e74c3c;color:#fff;
        border-radius:10px;padding:1px 5px;font-size:10px;font-weight:700;
        min-width:16px;text-align:center;line-height:16px;
      ">0</span>
    </div>
    <!-- Utente -->
    <div class="topbar-user">
      <span id="topbar-nome"></span>
      <span id="topbar-badge" class="badge-role"></span>
    </div>
    <button class="btn-logout" id="btn-logout" title="Esci">
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </div>
</div>

<!-- LAYOUT PRINCIPALE: mappa + pannello dx -->
<div class="main-layout">
  <!-- MAPPA -->
  <div id="map">
    <!-- Legenda efficienza energetica (overlay) -->
    <div class="marker-legend" id="marker-legend">
      <div class="marker-legend-title">Efficienza energetica</div>
      <div class="marker-legend-item" title="Consumo kWh/m² nella norma o sotto la media">
        <div class="marker-legend-dot" style="color:#27AE60;"></div>
        <span>Alta</span>
        <span style="font-size:9px;color:var(--text-secondary);margin-left:4px;">kWh/m² basso</span>
      </div>
      <div class="marker-legend-item" title="Consumo kWh/m² leggermente sopra la media">
        <div class="marker-legend-dot" style="color:#F39C12;"></div>
        <span>Media</span>
        <span style="font-size:9px;color:var(--text-secondary);margin-left:4px;"></span>
      </div>
      <div class="marker-legend-item" title="Consumo kWh/m² elevato, anomalie rilevate">
        <div class="marker-legend-dot" style="color:#E74C3C;"></div>
        <span>Bassa</span>
        <span style="font-size:9px;color:var(--text-secondary);margin-left:4px;">kWh/m² alto</span>
      </div>
    </div>
    <!-- Loader -->
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <span style="font-size:12px;color:var(--text-secondary);">Caricamento asset in corso...</span>
    </div>
  </div>

  <!-- Toggle pannello laterale -->
  <div class="panel-toggle" id="panel-toggle" title="Apri/chiudi pannello">
    <i class="fas fa-chevron-right" id="panel-toggle-icon"></i>
  </div>

  <!-- PANNELLO LATERALE DESTRO -->
  <div class="side-panel" id="side-panel">
    <div class="panel-header">
      <div class="panel-header-title" id="panel-header-title">
        <span id="panel-header-text">Quadro energetico</span>
      </div>
      <div class="panel-header-meta" id="panel-header-meta">
        <span class="meta-dot"></span>
        <span id="panel-header-ts">Live &mdash; aggiornamento in corso&hellip;</span>
      </div>
    </div>
    <!-- Vista panoramica (default) -->
    <div class="overview-panel" id="overview-panel">
      <div style="text-align:center;padding:30px;color:var(--text-secondary);">
        <i class="fas fa-spinner fa-spin"></i>
      </div>
    </div>
  </div>
</div>

<!-- La modale dettaglio asset è iniettata da efficiency-detail-modal.js -->

<!-- JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Plotly caricato in lazy load da efficiency-map-stats.js dopo il DOM -->
<script src="/static/js/i18n.js?v=8"></script>
<script src="/static/js/api.js?v=8"></script>
<script src="/static/js/utils.js?v=8"></script>
<!-- Configurazione centralizzata (deve precedere tutti i moduli mappa) -->
<script src="/static/js/config.js"></script>
<!-- Modale dettaglio asset condivisa -->
<script src="/static/js/efficiency-detail-modal.js?v=8"></script>
<!-- Moduli mappa efficiency (ordine di caricamento obbligatorio) -->
<script src="/static/js/efficiency-map-config.js"></script>
<script src="/static/js/efficiency-map-core.js"></script>
<script src="/static/js/efficiency-map-stats.js"></script>
</body>
</html>
