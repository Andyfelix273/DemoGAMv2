<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>GIS Asset Manager – Work Order</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/v4-shims.min.css">
  <style>
    /* Scaduto highlight */
    .scaduto-row { background:rgba(248,81,73,0.04) !important; }
    .scaduto-row:hover { background:rgba(248,81,73,0.08) !important; }
    .scaduto-label { font-size:10px; color:var(--accent-red); font-weight:600; margin-left:4px; }
  </style>
  <link rel="stylesheet" href="/static/css/icons.css">
  <link rel="stylesheet" href="/static/css/bems-ui.css">
</head>
<body class="app-layout">

<nav class="sidebar" id="sidebar"></nav>

<div class="sidebar-content">
  <header class="topbar" id="topbar"></header>

  <div class="page">
    <div class="page-header">
      <div class="page-title"><i class="fa fa-wrench" style="margin-right:8px;color:var(--accent-blue)"></i>Work Order</div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="btn-export-wo" onclick="window.location.href='/api/export/workorders/excel'" title="Esporta in Excel">
          <i class="fa fa-file-excel"></i> Export Excel
        </button>
        <button class="btn btn-primary" id="btn-nuovo-wo" style="display:none" onclick="WoPanel._apriNuovo()">
          <i class="fa fa-plus"></i> Nuovo WO
        </button>
      </div>
    </div>

    <div class="page-body">

      <!-- KPI bar -->
      <div class="kpi-bar" id="kpi-bar">
        <div class="kpi-card danger"><div class="kpi-val" id="kpi-aperti">–</div><div class="kpi-lbl">Aperti</div></div>
        <div class="kpi-card warning"><div class="kpi-val" id="kpi-in-corso">–</div><div class="kpi-lbl">In corso</div></div>
        <div class="kpi-card danger"><div class="kpi-val" id="kpi-scaduti">–</div><div class="kpi-lbl">Scaduti</div></div>
        <div class="kpi-card warning"><div class="kpi-val" id="kpi-urgenti">–</div><div class="kpi-lbl">Urgenti</div></div>
        <div class="kpi-card ok"><div class="kpi-val" id="kpi-completati">–</div><div class="kpi-lbl">Completati</div></div>
      </div>

      <!-- Filtri -->
      <div class="filtri-bar">
        <input type="text" id="search-input" placeholder="Cerca WO, asset..." oninput="filtra()" style="flex:1;min-width:180px">
        <select id="filter-stato" onchange="filtra()">
          <option value="">Tutti gli stati</option>
          <option value="aperto">Aperto</option>
          <option value="in_corso">In corso</option>
          <option value="completato">Completato</option>
          <option value="annullato">Annullato</option>
        </select>
        <select id="filter-tipo" onchange="filtra()">
          <option value="">Tutti i tipi</option>
          <option value="correttivo">Correttivo</option>
          <option value="preventivo">Preventivo</option>
          <option value="ispezione">Ispezione</option>
        </select>
        <select id="filter-priorita" onchange="filtra()">
          <option value="">Tutte le priorità</option>
          <option value="critica">Critica</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="bassa">Bassa</option>
        </select>
        <span class="record-count" id="record-count"></span>
      </div>

      <!-- Tabella -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Codice</th>
              <th>Titolo</th>
              <th>Asset</th>
              <th>Tipo</th>
              <th>Priorità</th>
              <th>Stato</th>
              <th>Assegnatario</th>
              <th>Data pianif.</th>
              <th>Apertura</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="wo-tbody">
            <tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text-muted)">Caricamento...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>

    </div>
  </div>
</div>

<!-- WoPanel inietta le modali CRUD nel body automaticamente al mount() -->

<script src="/static/js/wo-panel.js"></script>
<script src="/static/js/i18n.js?v=6"></script>
<script src="/static/js/api.js?v=6"></script>
<script src="/static/js/utils.js?v=8"></script>
<script>
requireAuth();
renderSidebar('workorders');
renderTopbar('workorders', { filtri: false });
initAlarmNotifications();

// ── Stato locale ──────────────────────────────────────────────────────────────
var woList     = [];
var woFiltrati = [];
var PAGE_SIZE  = 15;
var paginaCorrente = 1;
var oggi = new Date().toISOString().split('T')[0];

// ── Avvio ─────────────────────────────────────────────────────────────────────
(async function init() {
  // Permessi
  if (API.can('work_orders.create')) {
    document.getElementById('btn-nuovo-wo').style.display = '';
  }

  // Monta WoPanel: inietta le modali CRUD nel body e gestisce salvataggio
  WoPanel.mount(document.body, {
    assetId:  null,
    zIndex:   1000,
    onSave:   async () => { await caricaKPI(); await caricaWO(); }
  });

  // Prefill da parametri URL (es. da pagina allarmi)
  const urlParams      = new URLSearchParams(window.location.search);
  const prefillAssetId = urlParams.get('asset_id');
  const prefillTitolo  = urlParams.get('titolo');
  const prefillTipo    = urlParams.get('tipo');
  const prefillPriorita = urlParams.get('priorita');

  await caricaKPI();
  await caricaWO();

  // Apri automaticamente il form se arriva da un allarme
  if (prefillAssetId && prefillTitolo && API.can('work_orders.create')) {
    WoPanel._apriNuovo({
      asset_id: parseInt(prefillAssetId),
      titolo:   decodeURIComponent(prefillTitolo),
      tipo:     prefillTipo    || 'correttivo',
      priorita: prefillPriorita || 'alta',
    });
  }
})();

// ── KPI ───────────────────────────────────────────────────────────────────────
async function caricaKPI() {
  try {
    const s = await API.getWorkOrderStats();
    document.getElementById('kpi-aperti').textContent     = s.aperti     ?? 0;
    document.getElementById('kpi-in-corso').textContent   = s.in_corso   ?? 0;
    document.getElementById('kpi-scaduti').textContent    = s.scaduti    ?? 0;
    document.getElementById('kpi-urgenti').textContent    = s.urgenti    ?? 0;
    document.getElementById('kpi-completati').textContent = s.completati ?? 0;
  } catch(e) { console.warn('Errore KPI WO:', e); }
}

// ── Caricamento lista ─────────────────────────────────────────────────────────
async function caricaWO() {
  try {
    woList = await API.getWorkOrders();
    filtra();
  } catch(e) {
    document.getElementById('wo-tbody').innerHTML =
      `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--accent-red)">Errore caricamento work order</td></tr>`;
  }
}

// ── Filtri ────────────────────────────────────────────────────────────────────
function filtra() {
  const testo    = document.getElementById('search-input').value.toLowerCase();
  const stato    = document.getElementById('filter-stato').value;
  const tipo     = document.getElementById('filter-tipo').value;
  const priorita = document.getElementById('filter-priorita').value;
  woFiltrati = woList.filter(w => {
    const matchTesto = !testo ||
      (w.codice     || '').toLowerCase().includes(testo) ||
      (w.titolo     || '').toLowerCase().includes(testo) ||
      (w.asset_nome || '').toLowerCase().includes(testo) ||
      (w.assegnatario || '').toLowerCase().includes(testo);
    const matchStato    = !stato    || w.stato    === stato;
    const matchTipo     = !tipo     || w.tipo     === tipo;
    const matchPriorita = !priorita || w.priorita === priorita;
    return matchTesto && matchStato && matchTipo && matchPriorita;
  });
  paginaCorrente = 1;
  renderTabella();
}

// ── Render tabella ────────────────────────────────────────────────────────────
function renderTabella() {
  const start  = (paginaCorrente - 1) * PAGE_SIZE;
  const pagina = woFiltrati.slice(start, start + PAGE_SIZE);
  const tbody  = document.getElementById('wo-tbody');
  document.getElementById('record-count').textContent = `${woFiltrati.length} work order`;

  if (!pagina.length) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text-muted)">Nessun work order trovato</td></tr>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  tbody.innerHTML = pagina.map(wo => {
    const scaduto = wo.data_pianificata && wo.data_pianificata < oggi &&
                    !['completato','annullato'].includes(wo.stato);
    const rowClass = scaduto ? 'scaduto-row' : '';
    const dataPian = wo.data_pianificata
      ? `${formatData(wo.data_pianificata)}${scaduto ? '<span class="scaduto-label">SCADUTO</span>' : ''}`
      : '<span style="color:var(--text-muted)">—</span>';
    const canEdit   = API.can('work_orders.update');
    const canDelete = API.can('work_orders.delete');
    const canStato  = canEdit && !['completato','annullato'].includes(wo.stato);
    return `<tr class="${rowClass}" ondblclick="WoPanel._apriDettaglio(${wo.id})">
      <td><span style="font-family:monospace;font-size:12px;font-weight:600">${wo.codice}</span></td>
      <td style="max-width:260px">
        <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${wo.titolo}">${wo.titolo}</div>
      </td>
      <td>
        <div style="font-size:12px">${wo.asset_nome}</div>
        <div style="font-size:11px;color:var(--text-muted)">${wo.asset_citta || ''}</div>
      </td>
      <td><span class="tipo-badge">${wo.tipo}</span></td>
      <td><span class="prio prio-${wo.priorita}">${wo.priorita.toUpperCase()}</span></td>
      <td><span class="badge badge-${wo.stato}">${labelStato(wo.stato)}</span></td>
      <td style="font-size:12px">${wo.assegnatario || '<span style="color:var(--text-muted)">—</span>'}</td>
      <td style="font-size:12px">${dataPian}</td>
      <td style="font-size:12px">${formatDataOra(wo.data_apertura)}</td>
      <td>
        <div class="row-actions">
          <button class="btn-icon" title="Dettaglio" onclick="WoPanel._apriDettaglio(${wo.id})"><i class="fa fa-eye"></i></button>
          ${canStato  ? `<button class="btn-icon" title="Cambia stato" onclick="WoPanel._apriCambioStato(${wo.id})"><i class="fa fa-exchange"></i></button>` : ''}
          ${canEdit   ? `<button class="btn-icon" title="Modifica" onclick="WoPanel._apriModifica(${wo.id})"><i class="fa fa-pen"></i></button>` : ''}
          ${canDelete ? `<button class="btn-icon danger" title="Elimina" onclick="WoPanel._elimina(${wo.id})"><i class="fa fa-trash"></i></button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
  renderPaginazione();
}

// ── Paginazione ───────────────────────────────────────────────────────────────
function renderPaginazione() {
  const totPagine = Math.ceil(woFiltrati.length / PAGE_SIZE);
  if (totPagine <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="cambiaPagina(${paginaCorrente-1})" ${paginaCorrente===1?'disabled':''}>‹</button>`;
  for (let i = 1; i <= totPagine; i++) {
    html += `<button class="page-btn ${i===paginaCorrente?'active':''}" onclick="cambiaPagina(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="cambiaPagina(${paginaCorrente+1})" ${paginaCorrente===totPagine?'disabled':''}>›</button>`;
  document.getElementById('pagination').innerHTML = html;
}
function cambiaPagina(n) { paginaCorrente = n; renderTabella(); }

// ── Helpers ───────────────────────────────────────────────────────────────────
function labelStato(s) {
  return { aperto:'Aperto', in_corso:'In corso', completato:'Completato', annullato:'Annullato' }[s] || s;
}
function formatData(d) {
  if (!d) return '—';
  const [y,m,g] = d.split('-');
  return `${g}/${m}/${y}`;
}
function formatDataOra(dt) {
  if (!dt) return '—';
  try {
    const date = new Date(dt);
    if (isNaN(date.getTime())) return dt;
    const g  = String(date.getDate()).padStart(2,'0');
    const m  = String(date.getMonth()+1).padStart(2,'0');
    const y  = date.getFullYear();
    const hh = String(date.getHours()).padStart(2,'0');
    const mm = String(date.getMinutes()).padStart(2,'0');
    return `${g}/${m}/${y} ${hh}:${mm}`;
  } catch(e) { return dt; }
}
</script>
</body>
</html>
