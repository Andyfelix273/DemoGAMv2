server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy API → backend ───────────────────────────────────────────
    # Tutte le chiamate /api/* vengono inoltrate al container backend
    location /api/ {
        proxy_pass         http://backend:8500/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Proxy /static/bim/* → backend (per SVG planimetrie BIM) ─────
    location /static/bim/ {
        proxy_pass         http://backend:8500/static/bim/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SPA fallback: tutte le route React → index.html ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compressione gzip ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
}
